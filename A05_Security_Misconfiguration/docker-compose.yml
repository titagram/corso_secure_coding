services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: a05_misconfig_web
    ports:
      - "8005:80"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_NAME=document_system
      - DB_USER=root
      - DB_PASSWORD=rootpassword
    networks:
      - a05_misconfig_network

  db:
    image: mysql:8.0
    container_name: a05_misconfig_db
    ports:
      - "3305:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: document_system
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - a05_misconfig_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:

networks:
  a05_misconfig_network:
    driver: bridge

