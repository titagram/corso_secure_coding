# Apache HTTP Server Configuration
# OWASP A05: Security Misconfiguration
# 
# VULNERABILITÀ: Configurazione con directory listing abilitato
# VULNERABILITÀ: Headers di sicurezza mancanti
# VULNERABILITÀ: Server signature esposta

ServerRoot "/usr/local/apache2"
Listen 80
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule dir_module modules/mod_dir.so

<Directory "/var/www/html">
    # VULNERABILITÀ CRITICA: Options Indexes abilita directory listing!
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
    
    # VULNERABILITÀ: Nessuna restrizione su file sensibili
    # Dovrebbe bloccare accesso a .env, .sql, .bak, etc.
</Directory>

# VULNERABILITÀ: Server signature esposta (mostra versione Apache)
ServerTokens Full
ServerSignature On

# VULNERABILITÀ: Nessun header di sicurezza configurato
# Manca X-Content-Type-Options
# Manca X-Frame-Options  
# Manca Strict-Transport-Security
# Manca Content-Security-Policy
# Manca X-XSS-Protection

# Directory per file caricati (VULNERABILE: accessibile pubblicamente)
<Directory "/var/www/html/uploads">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# Directory per backup (VULNERABILE: accessibile pubblicamente!)
<Directory "/var/www/html/backups">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# Directory per log (VULNERABILE: accessibile pubblicamente!)
<Directory "/var/www/html/logs">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# Directory per admin (VULNERABILE: accessibile pubblicamente!)
<Directory "/var/www/html/admin">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

