services:
  web:
    build: .
    ports:
      - "8010:80"
    depends_on:
      - db
      - redis
    environment:
      - DB_HOST=db
      - DB_NAME=url_preview
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - REDIS_HOST=redis

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: url_preview
    ports:
      - "3310:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6370:6379"
    volumes:
      - redis_data:/data

volumes:
  db_data:
  redis_data:

