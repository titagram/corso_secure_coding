services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: a06_components_web
    ports:
      - "8006:80"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_NAME=blog_system
      - DB_USER=root
      - DB_PASSWORD=rootpassword
    networks:
      - a06_components_network

  db:
    image: mysql:5.7
    container_name: a06_components_db
    ports:
      - "3316:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: blog_system
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - a06_components_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:

networks:
  a06_components_network:
    driver: bridge

