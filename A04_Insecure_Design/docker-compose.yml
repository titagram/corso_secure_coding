services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: a04_design_web
    ports:
      - "8004:80"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_NAME=booking_system
      - DB_USER=root
      - DB_PASSWORD=rootpassword
    networks:
      - a04_design_network

  db:
    image: mysql:8.0
    container_name: a04_design_db
    ports:
      - "3304:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: booking_system
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - a04_design_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:

networks:
  a04_design_network:
    driver: bridge

